version: 2
updates:
  # --- Python services ---
  - package-ecosystem: pip
    directory: /sensor-simulator
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: pip
    directory: /llm-agent
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: pip
    directory: /orchestrator
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: pip
    directory: /dashboard/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  # --- Frontend ---
  - package-ecosystem: npm
    directory: /dashboard/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]

  # --- Container base images ---
  # NOTE: base images MUST carry a tag next to the digest
  # (e.g. `cgr.dev/chainguard/wolfi-base:latest@sha256:...`), otherwise
  # Dependabot cannot resolve the tag and silently skips digest updates.
  - package-ecosystem: docker
    directories:
      - /sensor-simulator
      - /llm-agent
      - /orchestrator
      - /dashboard/api
      - /dashboard/frontend
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    # One consolidated PR per week for all base-image digest bumps.
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      # The python build stage is hard-coupled to the runtime image: the
      # final stage does `apk add python-3.12` and sets
      # PYTHONPATH=/usr/local/lib/python3.12/site-packages, so a build-stage
      # major/minor bump silently produces an image whose wheels no longer
      # match the interpreter. Digest updates (security patches) still flow;
      # a real interpreter upgrade has to change both stages together.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, ci]
