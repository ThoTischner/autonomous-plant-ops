version: 2
updates:
  # --- Python services ---
  - package-ecosystem: pip
    directory: /sensor-simulator
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: pip
    directory: /llm-agent
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: pip
    directory: /orchestrator
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]
  - package-ecosystem: pip
    directory: /dashboard/api
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, python]

  # --- Frontend ---
  - package-ecosystem: npm
    directory: /dashboard/frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]

  # --- Container base images ---
  # NOTE: base images MUST carry a tag next to the digest
  # (e.g. `cgr.dev/chainguard/wolfi-base:latest@sha256:...`), otherwise
  # Dependabot cannot resolve the tag and silently skips digest updates.
  - package-ecosystem: docker
    directories:
      - /sensor-simulator
      - /llm-agent
      - /orchestrator
      - /dashboard/api
      - /dashboard/frontend
    schedule: { interval: weekly }
    labels: [dependencies, docker]
    # One consolidated PR per week for all base-image digest bumps.
    groups:
      base-images:
        patterns: ["*"]

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies, ci]
