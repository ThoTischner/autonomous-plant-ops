# Default values for autonomous-plant-ops.

image:
  # -- Registry prefix including the trailing slash. Empty (`""`) for local builds.
  registry: "ghcr.io/thotischner/"
  # -- Image tag. Empty = pinned to `Chart.AppVersion` (recommended, reproducible). For dev e.g. `main`.
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Pull secrets for private registries.
imagePullSecrets: []

# -- Application services. The keys are used verbatim as Kubernetes service names (do not rename — inter-service URLs depend on them).
# @default -- see fields below
services:
  sensor-simulator:
    # -- Image repository (combined with `image.registry` and tag).
    image: autonomous-plant-ops/sensor-simulator
    # -- Replica count.
    replicas: 1
    # -- Container/service port.
    port: 8001
    # -- HTTP path for the readiness/liveness probe.
    healthPath: /health
    # -- Environment variables.
    env:
      EQUIPMENT_FILE: /data/equipment.json
    # -- Persistent equipment definition (PVC). `enabled: false` = ephemeral.
    persistence:
      enabled: true
      size: 1Gi
      mountPath: /data
      storageClass: ""
    # -- Resource requests/limits.
    resources: {}

  llm-agent:
    # -- Image repository.
    image: autonomous-plant-ops/llm-agent
    # -- Replica count.
    replicas: 1
    # -- Container/service port.
    port: 8002
    # -- HTTP path for the probes.
    healthPath: /health
    # -- Additional environment variables. `OLLAMA_HOST` is set automatically from `.ollama`.
    env:
      OLLAMA_MODEL: "llama3.2:3b"
    # -- Resource requests/limits.
    resources: {}

  orchestrator:
    # -- Image repository.
    image: autonomous-plant-ops/orchestrator
    # -- Replica count. Must stay `1` (otherwise duplicate scenario triggers).
    replicas: 1
    # -- `false` = no Kubernetes service/port (pure loop container).
    service: false
    # -- Environment variables of the monitoring loop.
    env:
      SENSOR_URL: "http://sensor-simulator:8001"
      AGENT_URL: "http://llm-agent:8002"
      DASHBOARD_URL: "http://dashboard-api:8003"
      CYCLE_INTERVAL: "12"
      SCENARIO_CHANCE: "0.08"
    # -- Resource requests/limits.
    resources: {}

  dashboard-api:
    # -- Image repository.
    image: autonomous-plant-ops/dashboard-api
    # -- Replica count.
    replicas: 1
    # -- Container/service port.
    port: 8003
    # -- HTTP path for the probes.
    healthPath: /health
    # -- Resource requests/limits.
    resources: {}

  dashboard-frontend:
    # -- Image repository (Chainguard/Wolfi nginx, nonroot; proxies `/api/` to the dashboard-api).
    image: autonomous-plant-ops/dashboard-frontend
    # -- Replica count.
    replicas: 1
    # -- Container/service port (nonroot nginx -> unprivileged port 8080).
    port: 8080
    # -- nginx needs writable runtime paths -> no read-only root.
    readOnlyRootFilesystem: false
    # -- Resource requests/limits.
    resources: {}

ollama:
  # -- Operating mode: `external` (external endpoint) or `in-cluster` (Ollama inside the cluster).
  mode: external

  external:
    # -- Fully qualified URL of the external Ollama server (only for `mode: external`).
    host: "http://host.docker.internal:11434"

  inCluster:
    # -- Ollama image (only for `mode: in-cluster`).
    image: ollama/ollama:latest
    # -- Image pull policy.
    pullPolicy: IfNotPresent
    # -- Service port.
    port: 11434
    # -- Model (must be pulled once after deploy, see NOTES).
    model: "llama3.2:3b"
    # -- Resource requests/limits.
    resources: {}
    persistence:
      # -- Persistent model storage via PVC.
      enabled: true
      # -- PVC size.
      size: 20Gi
      # -- StorageClass (empty = default).
      storageClass: ""
    gpu:
      # -- Enable GPU for Ollama.
      enabled: false
      # -- GPU resource name.
      resourceName: "nvidia.com/gpu"
      # -- Number of GPUs.
      count: 1
      # -- NodeSelector for GPU nodes.
      nodeSelector: {}
      # -- Tolerations for GPU nodes.
      tolerations: []

# -- Exposure of the user-facing entry point (dashboard-frontend). Internal
# services always stay ClusterIP. Freely combinable with `ingress`.
frontend:
  service:
    # -- Service type: `ClusterIP` | `NodePort` | `LoadBalancer`.
    type: ClusterIP
    # -- Fixed NodePort (only `type: NodePort`; empty = automatic 30000–32767).
    nodePort: ""
    # -- Desired LoadBalancer IP (only `type: LoadBalancer`, optional).
    loadBalancerIP: ""
    # -- Additional service annotations (e.g. cloud LB tuning).
    annotations: {}

ingress:
  # -- Enable ingress (independent of `frontend.service.type`).
  enabled: true
  # -- IngressClass name: `nginx` | `traefik` | custom name | `""` (default class).
  className: nginx
  # -- Annotation preset matching the controller: `nginx` | `traefik` | `none`. Keeps the SSE stream `/events/stream` open (no buffering, long timeouts).
  controller: nginx
  # -- Hostname.
  host: plant-ops.local
  # -- HTTP path.
  path: /
  # -- pathType: `Prefix` | `Exact` | `ImplementationSpecific`.
  pathType: Prefix
  # -- Additional annotations (merged over the controller preset, can override it).
  annotations: {}
  tls:
    # -- Enable TLS.
    enabled: false
    # -- Name of the TLS secret (empty = `<Release>-tls`).
    secretName: ""
  # -- cert-manager integration: sets the issuer annotation and enables TLS automatically.
  certManager:
    # -- Enable cert-manager issuance.
    enabled: false
    # -- Name of the Issuer/ClusterIssuer.
    issuerName: ""
    # -- Issuer kind: `ClusterIssuer` | `Issuer`.
    issuerKind: ClusterIssuer

# -- Pod annotations (all deployments).
podAnnotations: {}
# -- NodeSelector (all deployments).
nodeSelector: {}
# -- Tolerations (all deployments).
tolerations: []
# -- Affinity (all deployments).
affinity: {}

# -- Default resources (apply when a service sets no own `resources`). Sets
# requests AND limits -> clears the KSV resource checks.
defaultResources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi

# -- Hardened SecurityContext for all deployments (matches the nonroot
# Wolfi/Chainguard images: runAsNonRoot, caps drop ALL, no privilege
# escalation, seccomp RuntimeDefault). Write access only via a
# /tmp emptyDir and persistent volumes.
securityContext:
  # -- Enable SecurityContext.
  enabled: true
  # -- UID (nonroot, matches the images).
  runAsUser: 65532
  # -- GID.
  runAsGroup: 65532
  # -- fsGroup for mounted volumes.
  fsGroup: 65532
  # -- Read-only root filesystem (global). Overridable per service via `services.<name>.readOnlyRootFilesystem`.
  readOnlyRootFilesystem: true
