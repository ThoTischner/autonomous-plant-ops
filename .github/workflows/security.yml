name: Security

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Monday 05:11 UTC — catches newly disclosed CVEs in pinned deps
    - cron: "11 5 * * 1"

permissions:
  contents: read

jobs:
  # Dependency gate for the frontend (mirrors the org pattern in
  # observability-mcp: npm audit at high is the hard gate for JS deps).
  npm-audit:
    name: "npm audit (dashboard-frontend)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: npm audit (high)
        working-directory: ./dashboard/frontend
        run: npm audit --audit-level=high

  # Trivy reports ALL HIGH/CRITICAL findings to the Security tab (SARIF), then
  # a separate gate step fails the job on findings that already have a fix
  # (ignore-unfixed) — so a fixable CVE turns the run red and triggers the
  # failure notification, while unfixable base-image CVEs stay report-only.
  trivy-fs:
    name: "Trivy — filesystem (deps, secrets, misconfig)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Trivy filesystem gate (fixable vulns + secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  image-scan:
    name: "Trivy + SBOM — ${{ matrix.name }}"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: sensor-simulator,   context: sensor-simulator }
          - { name: llm-agent,          context: llm-agent }
          - { name: orchestrator,       context: orchestrator }
          - { name: dashboard-api,      context: dashboard/api }
          - { name: dashboard-frontend, context: dashboard/frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.name }}:scan

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-image-${{ matrix.name }}

      - name: Generate SBOM (Trivy, SPDX-JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          format: spdx-json
          output: sbom-${{ matrix.name }}.spdx.json
          exit-code: "0"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}.spdx.json
          retention-days: 90

      - name: Trivy image gate (fixable vulns)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.name }}:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  # Third-party Ollama image used by the chart in `ollama.mode: in-cluster`.
  # The ref is read from values.yaml so scan and chart can never drift apart
  # (Dependabot's helm ecosystem bumps the pin there). Trivy pulls it straight
  # from the registry; the image is ~3.4 GB (CUDA libs), hence the long timeout.
  ollama-scan:
    name: "Trivy — ollama (third-party)"
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Ollama image ref from values.yaml
        id: ref
        run: |
          ref="$(sed -nE 's/^    image: (ollama\/ollama:.+)$/\1/p' helm/autonomous-plant-ops/values.yaml)"
          test -n "${ref}" || { echo "::error::ollama.inCluster.image not found in values.yaml"; exit 1; }
          echo "image=${ref}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}
          format: sarif
          output: trivy-ollama.sarif
          severity: HIGH,CRITICAL
          timeout: 30m
          exit-code: "0"

      - name: Upload Trivy image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-ollama.sarif
          category: trivy-image-ollama

      # Reuses the layer cache from the scan above, so this second pass is fast.
      - name: Trivy image gate (fixable vulns)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ref.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          timeout: 30m
          exit-code: "1"
