name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Weekly no-cache rebuild: base packages (e.g. apk python-3.12) are installed
  # at build time, so a fresh rebuild pulls the latest patched packages even
  # when the pinned base digest is unchanged. Also re-tags the current release
  # (appVersion) so the images ArtifactHub scans stay patched.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    name: "${{ matrix.name }} — test & push"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sensor-simulator
            context: sensor-simulator
            test: "true"
          - name: llm-agent
            context: llm-agent
            test: "true"
          - name: dashboard-api
            context: dashboard/api
            test: "true"
          - name: dashboard-frontend
            context: dashboard/frontend
            test: "frontend"
          - name: orchestrator
            context: orchestrator
            test: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint & unit-test (Python services)
        if: matrix.test == 'true'
        run: |
          docker build -f ${{ matrix.context }}/Dockerfile.test -t ${{ matrix.name }}-test ${{ matrix.context }}/
          docker run --rm ${{ matrix.name }}-test ruff check src/
          docker run --rm ${{ matrix.name }}-test mypy src/ --ignore-missing-imports
          docker run --rm ${{ matrix.name }}-test pytest tests/ -v --tb=short

      - name: Type-check & lint (frontend)
        if: matrix.test == 'frontend'
        run: |
          docker build -f ${{ matrix.context }}/Dockerfile.test -t ${{ matrix.name }}-test ${{ matrix.context }}/
          docker run --rm ${{ matrix.name }}-test npx tsc --noEmit
          docker run --rm ${{ matrix.name }}-test npx eslint src/ --ext .ts,.tsx || true

      - name: Set up QEMU (multi-arch emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read chart appVersion (for release re-tag on rebuilds)
        id: ver
        run: |
          v="$(awk -F'\"' '/^appVersion:/{print $2; exit}' helm/autonomous-plant-ops/Chart.yaml)"
          echo "appVersion=${v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          # On scheduled / manual rebuilds, also refresh the current release tag
          # (appVersion) so the freshly patched image lands on the tag the Helm
          # chart pins and ArtifactHub scans.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.appVersion }},enable=${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

      - name: Build (and push on non-PR)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Release (tag), scheduled and manual rebuilds bypass the layer cache
          # so the `apk add` step re-resolves the latest patched packages.
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
